[package]
name = "learnflix"
version = "2.1.0"
description = "Astroflix — cursos das suas pastas, com progresso confiável"
edition = "2021"

[lib]
name = "learnflix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-single-instance = "2"
serde_json = "1"

# Sem LTO e com as unidades de compilação padrão: com `lto = true` e
# `codegen-units = 1`, cada release refazia a otimização do programa inteiro (não
# entra no cache) e o passo do Tauri levava de 3 a 5 minutos por plataforma. Este
# binário tem ~10 MB perto dos ~110 MB do servidor: o tamanho quase não muda.
[profile.release]
opt-level = "s"
strip = true

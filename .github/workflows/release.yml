name: Release

# Publica uma versão do app desktop: o instalador de cada sistema e o
# latest.json do atualizador, anexados à release da tag. Dispara por tag
# (v2.1.0, v2.2.0…).
on:
  push:
    tags: ['v*']
  # Permite ensaiar o build da matriz sem publicar nada.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Testar uma vez só, antes de gastar a matriz inteira: se a suíte quebra, não
  # há por que construir quatro instaladores.
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # A release nasce como rascunho e só vira pública no fim. O atualizador lê
  # releases/latest/download/latest.json, e "latest" ignora rascunhos: assim
  # ninguém recebe uma versão com metade das plataformas anexadas.
  rascunho:
    needs: testar
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.criar.outputs.id }}
    steps:
      - id: criar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Idempotente: numa reexecução a release já existe.
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --draft --generate-notes --title "Learnflix ${GITHUB_REF_NAME}"
          fi
          id=$(gh api "repos/${GH_REPO}/releases" --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .id")
          echo "id=${id}" >> "$GITHUB_OUTPUT"

  desktop:
    needs: [testar, rascunho]
    # Sem tag (workflow_dispatch), o rascunho é pulado e a matriz só ensaia o build.
    if: ${{ !failure() && !cancelled() && needs.testar.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
          - os: macos-15-intel
          - os: windows-latest
          # 22.04 e não latest: o AppImage leva a glibc da máquina que o gerou,
          # e a mais antiga abre em mais distribuições.
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # Node oficial: o do sistema às vezes vem sem suporte a executável único (SEA),
      # que é como o servidor vira o sidecar.
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }

      - name: Dependências do webkit (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      - run: pnpm build:binario
      - run: node scripts/preparar-sidecar.mjs
      - run: node scripts/sincronizar-versao.mjs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: pnpm tauri
          releaseId: ${{ needs.rascunho.outputs.id }}
          includeUpdaterJson: true

  publicar:
    needs: [rascunho, desktop]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Os quatro jobs da matriz atualizam o mesmo latest.json, cada um com a sua
        # plataforma; dois terminando juntos podem sobrescrever um ao outro. Se
        # faltar uma, quem usa aquele sistema nunca mais receberia atualização —
        # melhor não publicar e reexecutar o job que ficou de fora.
        run: |
          gh release download "${GITHUB_REF_NAME}" -p latest.json
          for p in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64; do
            jq -e --arg p "$p" '.platforms[$p].url' latest.json >/dev/null \
              || { echo "::error::latest.json sem a plataforma $p"; exit 1; }
          done
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest

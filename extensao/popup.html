<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Astroflix</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; width: 360px; font: 13px/1.4 -apple-system, system-ui, sans-serif; background: #0a0a0a; color: #e5e5e5; }
      main { padding: 14px; }
      h1 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
      label { display: block; margin: 10px 0 4px; color: #a3a3a3; font-size: 12px; }
      input, select { width: 100%; padding: 7px 8px; border: 1px solid #404040; border-radius: 6px; background: #171717; color: #fafafa; font: inherit; }
      input:focus, select:focus, button:focus-visible { outline: 2px solid #2563eb; outline-offset: 1px; }
      button { padding: 8px 12px; border: 0; border-radius: 6px; background: #262626; color: #fafafa; font: inherit; cursor: pointer; }
      button:hover { background: #404040; }
      button.principal { background: #2563eb; color: #fff; width: 100%; margin-top: 12px; }
      button.principal:hover { background: #3b82f6; }
      button:disabled { opacity: 0.4; cursor: default; }
      .linha { display: flex; gap: 6px; }
      .linha > input, .linha > select { flex: 1; }
      .videos { max-height: 140px; overflow: auto; margin-top: 4px; }
      .video { display: flex; gap: 6px; align-items: flex-start; padding: 4px 0; font-size: 11px; color: #a3a3a3; word-break: break-all; }
      .video input { width: auto; margin-top: 2px; }
      .aviso { margin-top: 10px; color: #a3a3a3; font-size: 12px; }
      .erro { color: #fcd34d; }
      .ok { color: #86efac; }
      .escondido { display: none; }
      a { color: #93c5fd; }
    </style>
  </head>
  <body>
    <main>
      <h1>Adicionar ao Astroflix</h1>

      <section id="parear" class="escondido">
        <p class="aviso">
          No Astroflix, abra <b>Configurações → Extensão do navegador</b>, copie a chave e cole aqui. O app precisa estar
          aberto.
        </p>
        <label for="chave">Chave</label>
        <input id="chave" autocomplete="off" spellcheck="false" />
        <button id="conectar" class="principal">Conectar</button>
      </section>

      <section id="principal" class="escondido">
        <label for="playlist">Playlist</label>
        <div class="linha">
          <select id="playlist"></select>
          <button id="nova" title="Nova playlist">+</button>
        </div>
        <div id="novaLinha" class="escondido" style="margin-top: 6px">
          <input id="novaNome" placeholder="Nome" />
          <div class="linha" style="margin-top: 6px">
            <button id="criar" style="flex: 1">Playlist nova</button>
            <button id="criarSub" style="flex: 1">Dentro da escolhida</button>
          </div>
        </div>

        <label for="titulo">Título da aula</label>
        <input id="titulo" />

        <label>Vídeo</label>
        <div id="videos" class="videos"></div>

        <button id="adicionar" class="principal">Adicionar</button>

        <details id="lote" style="margin-top: 14px">
          <summary style="cursor: pointer; color: #d4d4d4">Importar várias aulas</summary>
          <label class="video" style="color: #d4d4d4; font-size: 12px">
            <input type="radio" name="modo" value="seguir" checked /> Desta aula em diante, clicando no botão
          </label>
          <div id="campoBotao">
            <input id="textoBotao" spellcheck="false" aria-label="Texto do botão" />
          </div>
          <label class="video" style="color: #d4d4d4; font-size: 12px">
            <input type="radio" name="modo" value="lista" /> Clicando em cada aula da lista
          </label>
          <div id="campoSeletor" class="escondido">
            <input id="seletor" spellcheck="false" aria-label="Seletor das aulas" />
          </div>
          <label class="video" style="color: #d4d4d4; font-size: 12px">
            <input type="radio" name="modo" value="links" /> Abrindo cada link da página
          </label>
          <div id="campoLinks" class="escondido">
            <input id="seletorLinks" spellcheck="false" aria-label="Seletor dos links" />
          </div>
          <p class="aviso" id="loteInfo"></p>
          <div class="linha">
            <button id="loteIr" style="flex: 1">Importar todas</button>
            <button id="loteParar" class="escondido">Parar</button>
          </div>
          <p class="aviso" id="loteEstado" role="status"></p>
        </details>
      </section>

      <p id="msg" class="aviso" role="status"></p>
      <p class="aviso"><a href="#" id="trocar" class="escondido">Trocar a chave</a></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f1f1f1" media="(prefers-color-scheme: light)" />
    <script>
      // Antes de pintar: com o tema escolhido nas Configurações (lib/tema.ts), a
      // tela abriria na cor do sistema e trocaria depois de carregar o React.
      try {
        var t = JSON.parse(localStorage.getItem('tema'));
        if (t === 'claro' || t === 'escuro') document.documentElement.dataset.tema = t;
      } catch (e) {}
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Astroflix</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
